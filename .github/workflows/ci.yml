name: CI

# Chequeos rapidos en cada push a dev/main y en cada PR. No empaqueta nada: el
# build de instaladores sigue en build-win.yml / build-mac.yml (solo tags).
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.lock

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r python/requirements.lock
          python -m pip install -r python/requirements-dev.txt

      - name: Check (sintaxis Electron, compileall Python, build del renderer)
        run: pnpm run check

      - name: Tests JS (vitest)
        run: pnpm test

      - name: Lint Python (ruff)
        run: pnpm run lint:python

      - name: Tests Python (pytest)
        run: pnpm run test:python
