appId: com.lifibav3.desktop
productName: LifibaV3
copyright: Copyright (c) 2026 Lifiba
directories:
  output: release
  buildResources: resources/build
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
extraMetadata:
  author: Lifiba
  description: LifibaV3 Windows desktop scanner and player
  main: electron/main.js
extraResources:
  - from: "resources/python"
    to: "python"
    filter:
      - "**/*"
      - "!**/.gitkeep"
win:
  icon: icon.ico
  executableName: LifibaV3
  legalTrademarks: LifibaV3
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
mac:
  category: public.app-category.utilities
  # icon: icon.icns   # Opcional: agrega un .icns en resources/build para icono propio.
  # Sin cuenta Apple Developer no hay notarizacion, y hardenedRuntime sin
  # entitlements firmados solo rompe el child de Python (PyInstaller carga
  # dylibs sin firmar y onnxruntime usa memoria ejecutable). Va en false.
  hardenedRuntime: false
  gatekeeperAssess: false
  # Ad-hoc signing explicito: en Apple Silicon un binario sin firma alguna no
  # arranca (killed: 9). No pasa Gatekeeper, pero para build local alcanza.
  identity: "-"
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LifibaV3
  uninstallDisplayName: LifibaV3
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  deleteAppDataOnUninstall: false
  differentialPackage: false
